name: Build and Release IPK

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build IPK package
        run: |
          chmod +x build-ipk.sh
          ./build-ipk.sh
      
      - name: Get version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
      
      - name: List built files
        run: |
          ls -lh *.ipk
          echo "IPK file created successfully!"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-srun-ipk
          path: '*.ipk'
          retention-days: 30
      
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: '*.ipk'
          body: |
            ## Srun 认证客户端 / Srun Authentication Client
            
            ### 安装方法 / Installation
            
            1. 下载 `luci-app-srun_*.ipk` 文件 / Download the `luci-app-srun_*.ipk` file
            2. 上传到路由器 / Upload to router: `scp luci-app-srun_*.ipk root@192.168.1.1:/tmp/`
            3. 安装 / Install: `opkg install /tmp/luci-app-srun_*.ipk`
            
            详细安装说明请查看 [INSTALL.md](https://github.com/sunqian1117/luci-app-srun/blob/main/INSTALL.md)
            
            For detailed installation instructions, see [INSTALL.md](https://github.com/sunqian1117/luci-app-srun/blob/main/INSTALL.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
